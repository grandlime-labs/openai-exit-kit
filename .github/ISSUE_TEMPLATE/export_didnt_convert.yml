name: My export didn't convert
description: An Evals export or stored-prompt file failed or converted incorrectly. Use a redacted sample, never a real dump.
title: "[Export] "
labels: ["conversion"]
body:
  - type: markdown
    attributes:
      value: |
        Please help us fix the parser without sharing secrets.

        **Do not paste** API keys, organization IDs, real user text, production prompts, or a full account export. Replace strings with `REDACTED`, shrink arrays to 1–2 rows, and keep only the *shape* (grader types, data source kinds, field names).
  - type: dropdown
    id: tool
    attributes:
      label: How did you run it?
      options:
        - Web converter
        - CLI (`openai-exit-kit convert` or `prompts`)
        - Both
    validations:
      required: true
  - type: dropdown
    id: input-kind
    attributes:
      label: What did you try to convert?
      options:
        - Evals export (eval.json / runs / output items / datasets)
        - Stored prompt object (`pmpt_…` JSON)
        - Plain text prompt with `{{variables}}`
        - Mixed folder
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What went wrong?
      description: For example, a file was skipped, a grader became "manual" unexpectedly, a field was dropped, or the command crashed.
    validations:
      required: true
  - type: textarea
    id: redacted-sample
    attributes:
      label: Redacted sample
      description: |
        A minimal, redacted snippet that shows the shape. Useful fields for evals include `data_source_config.type`, `testing_criteria` grader `type`s, run `data_source` kinds, and file names (not contents). For prompts, include whether you have `versions[]`, `messages` / `instructions`, and variable names (not their values).
      placeholder: |
        {
          "id": "eval_REDACTED",
          "data_source_config": { "type": "custom" },
          "testing_criteria": [
            { "type": "string_check", "operation": "eq", "input": "{{ sample.output_text }}", "reference": "{{ item.ideal }}" }
          ]
        }
      render: json
    validations:
      required: true
  - type: textarea
    id: warnings
    attributes:
      label: Warnings or report excerpts
      description: Paste relevant lines from `MIGRATION_REPORT.md` or the on-page warnings list, with secrets removed.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, npm version, or commit if you know it.
      placeholder: "0.1.0"

name: Feature request
description: Suggest a conversion, CLI, or docs improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project is a free, open-source converter. Features that upload user files, add payment, or weaken the converter’s Content-Security-Policy will be declined.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to migrate or automate today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like?
      description: A short description of the feature. For new grader types or export shapes, a redacted example helps.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is not a request to convert Agent Builder workflows (please subscribe to the pinned Discussion instead, unless you are offering a concrete design).
          required: false
        - label: I am not asking the tool to upload my files or to add a paid plan.
          required: true

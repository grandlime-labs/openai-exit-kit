name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Converts the fixtures, runs `promptfoo validate config` on every generated config, then runs
      # `promptfoo eval` against a LOCAL mock OpenAI server. No API key, no network calls to OpenAI.
      - run: npm run verify:promptfoo
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/web
